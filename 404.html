    <script defer src="/bugdrop-init.js"></script>
    <style>
      .bd-trigger {
        padding: 2px 6px !important;
        font-size: 10.5px !important;
        border-radius: 3px !important;
        opacity: 0.65 !important;
      }
      .bd-trigger:hover {
        opacity: 1 !important;
      }
      .bd-trigger-label {
        font-size: 10.5px !important;
      }
      /* The widget parks its trigger at 25vh on the right edge, which on a
         phone sits over the map controls and the first result card. `top: auto`
         is the fix: an earlier `bottom` override alone could not move an element
         that still carried the widget's own `top`, so the pill stayed on top of
         the hero CTA ("Start a group") and the Discover cards. */
      @media (max-width: 767px) {
        .bd-trigger {
          /* The widget parks its trigger at 25vh on the right edge, which on a
             phone sits over the map controls and the first result card. `top:
             auto` is the fix: a `bottom` override alone could not move an
             element that still carried the widget's own `top`. The 640px rule
             below then makes it invisible at rest, because no fixed corner is
             reliably empty on a scrolling page. */
          top: auto !important;
          bottom: calc(76px + env(safe-area-inset-bottom)) !important;
        }
      }
      /* Small phones: the pill is a feedback affordance, not a control the page
         is competing with, and any fixed corner lands on real content on a long
         scrolling page — the products card on a pool page, the closing-soon row
         on Discover. Rather than chase a corner that is always empty (there
         isn't one), it is hidden until touched.

         `visibility: hidden` rather than `opacity: 0`: the widget paints its
         label and drag-handle children with their own opacity, so a transparent
         parent still showed a solid pill. `visibility` actually removes it from
         paint while `pointer-events` stays on (visibility:hidden elements still
         receive events), so the beta user can still reach it by tapping where it
         sits — and hovering or focusing it restores it visibly. */
      @media (max-width: 640px) {
        .bd-trigger {
          visibility: hidden !important;
          padding: 1px 5px !important;
          font-size: 10px !important;
          bottom: calc(64px + env(safe-area-inset-bottom)) !important;
          right: 4px !important;
        }
        .bd-trigger:hover,
        .bd-trigger:focus,
        .bd-trigger:focus-within,
        .bd-trigger:active {
          visibility: visible !important;
        }
        .bd-trigger-label {
          font-size: 10px !important;
        }
      }
    </style>
